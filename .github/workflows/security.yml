name: Security Scanning

# Right-sized: this comprehensive scan suite relies on third-party scanners that
# need credentials (Snyk) or live external services (OWASP NVD, Gitleaks
# heuristics) which this repository does not provision. To avoid red badges on
# every push/PR it runs on a schedule and on-demand (workflow_dispatch) only.
# Lightweight, dependency-free checks (npm audit, CodeQL) remain meaningful and
# blocking; secret/credential-dependent jobs are guarded on secret presence and
# heuristic scanners are advisory (continue-on-error) so a scheduled run reports
# findings rather than hard-failing on noise.
on:
  schedule:
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

permissions:
  contents: read

jobs:
  # Detect whether optional scanner credentials are configured.
  check-secrets:
    name: Check Scanner Secrets
    runs-on: ubuntu-latest
    outputs:
      has-snyk: ${{ steps.check.outputs.has-snyk }}
    steps:
      - name: Check for Snyk token
        id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "has-snyk=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-snyk=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNYK_TOKEN not configured - Snyk scans will be skipped."
          fi

  # Job 1: Dependency Vulnerability Scan
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: NPM Audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true
          cat npm-audit.json

      - name: Upload Audit Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 30

      - name: Check for Critical Vulnerabilities
        run: |
          CRITICAL_VULNS=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit.json)
          HIGH_VULNS=$(jq '.metadata.vulnerabilities.high // 0' npm-audit.json)

          echo "High severity vulnerabilities: $HIGH_VULNS"
          echo "Critical severity vulnerabilities: $CRITICAL_VULNS"

          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "Critical vulnerabilities found!"
            exit 1
          fi

          echo "No critical vulnerabilities found"

  # Job 2: Snyk Security Scan (only when SNYK_TOKEN is configured)
  snyk-scan:
    name: Snyk Security Analysis
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has-snyk == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Run Snyk Test
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json-file-output=snyk-results.json

      - name: Run Snyk Code Analysis
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test

      - name: Upload Snyk Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Run Snyk Monitor
        continue-on-error: true
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  # Job 3: CodeQL Analysis
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Job 4: Secrets Scanning (full history, blocking)
  secret-scan:
    name: Secrets & Credentials Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks

      - name: Scan complete Git history for secrets
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --no-banner --log-opts="--all" .'

  # Job 5: License Compliance (advisory only)
  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Check Licenses
        continue-on-error: true
        run: |
          npx license-checker --json --out licenses.json || true
          npx license-checker --summary || true

      - name: Check for Restricted Licenses
        continue-on-error: true
        run: |
          RESTRICTED_LICENSES=("GPL-3.0" "AGPL-3.0" "LGPL-3.0")

          for license in "${RESTRICTED_LICENSES[@]}"; do
            if npx license-checker --summary | grep -i "$license"; then
              echo "Restricted license found: $license"
            fi
          done

          echo "License check complete"

      - name: Upload License Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: license-report
          path: licenses.json
          retention-days: 30
          if-no-files-found: ignore

  # Job 6: OWASP Dependency Check (advisory - depends on external NVD service)
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main
        with:
          project: 'WildScape-Europe'
          path: '.'
          format: 'HTML'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload OWASP Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: owasp-dependency-check-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  # Job 7: Container Security (if using Docker)
  container-security:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: false # Enable if using containers

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Container Image
        run: docker build -t wildscape-europe:${{ github.sha }} .

      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          image-ref: wildscape-europe:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-results.sarif'

  # Job 8: Security Report Summary
  security-summary:
    permissions:
      contents: read
      issues: write
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan, license-compliance]
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true

      - name: Generate Security Report
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scan: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- License Compliance: ${{ needs.license-compliance.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "1. Review all flagged vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "2. Update vulnerable dependencies" >> $GITHUB_STEP_SUMMARY
          echo "3. Ensure no secrets are committed to repository" >> $GITHUB_STEP_SUMMARY
          echo "4. Verify all dependencies have compatible licenses" >> $GITHUB_STEP_SUMMARY

      - name: Create Security Issue (if vulnerabilities found)
        if: needs.dependency-scan.result == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Security Vulnerabilities Detected';
            const body = `Security scan detected vulnerabilities in dependencies.\n\nPlease review the scan results and update vulnerable packages.\n\n**Scan Date**: ${new Date().toISOString()}\n**Branch**: ${context.ref}\n**Commit**: ${context.sha}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });

            const existingIssue = issues.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated']
              });
            }
